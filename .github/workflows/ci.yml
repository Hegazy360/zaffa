name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Lets us re-run the whole pipeline from the GitHub UI without an empty
  # push. Vercel deploys are no longer gated on this, so re-running CI is
  # purely for re-evaluating quality signals on a known-good commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run tests
        run: npm test -- --run

  build:
    name: Production build
    runs-on: ubuntu-latest
    # Don't burn CI minutes compiling if unit tests or types are red.
    needs: [lint-typecheck, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        env:
          # CI-only stub values so `next build` can statically analyze the app
          # without contacting any real services. Production secrets live in
          # the deploy environment (Vercel project settings).
          NODE_ENV: production
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub?schema=public
          DIRECT_URL: postgresql://stub:stub@localhost:5432/stub?schema=public
          NEXT_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: stub-anon-key
          SUPABASE_SERVICE_ROLE_KEY: stub-service-role-key
          STRIPE_SECRET_KEY: sk_test_stub
          STRIPE_WEBHOOK_SECRET: whsec_stub
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_stub
          OPENAI_API_KEY: sk-stub
          RESEND_API_KEY: re_stub
          RESEND_FROM_EMAIL: stub@example.com
          NEXT_PUBLIC_APP_URL: https://example.com
          CRON_SECRET: stub-cron
          NOTIFICATION_UNSUBSCRIBE_SECRET: stub-unsubscribe
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: stub
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: stub
          CLOUDINARY_API_KEY: stub
          CLOUDINARY_API_SECRET: stub
          CI: "true"
        run: npm run build

  e2e:
    name: Playwright E2E (money paths: planner, pack, concierge)
    runs-on: ubuntu-latest
    # E2E is the slowest job — gate it on the cheaper jobs going green so we
    # don't burn 5 minutes of CI when we already know the change won't ship.
    needs: [lint-typecheck, test]
    # Opt-in: set the `E2E_ENABLED` repo variable to `true` once the E2E_*
    # secrets are populated. Skipped by default so missing secrets don't fail CI.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: zaffa
          POSTGRES_DB: postgres
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:zaffa@localhost:54329/postgres
      DIRECT_DATABASE_URL: postgresql://postgres:zaffa@localhost:54329/postgres
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_WEBHOOK_SECRET }}
      PAYMENT_SUCCESS_URL_BASE: http://localhost:3100
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      CRON_SECRET: e2e-cron-secret
      NOTIFICATION_UNSUBSCRIBE_SECRET: e2e-unsubscribe-secret-min-16-chars
      PLATFORM_FEE_PCT: "8"
      PLATFORM_NAME: Zaffa
      E2E_PORT: "3100"
      # money-path.spec.ts drives planner + vendor dashboards, which the
      # pivot hides behind `professionalSurfaces` (default off in prod).
      # Force it on for E2E so the existing money path stays exercised.
      # See docs/plan-pivot-2026-08.md Phase 0.2.
      FLAG_PROFESSIONAL_SURFACES: "true"
      # Stubs for third-party APIs the money path does not actually call but
      # whose SDKs throw at module-load time if the env var is missing (Resend
      # constructor, Cloudinary config, OpenAI/OpenRouter client).
      RESEND_API_KEY: re_stub
      RESEND_FROM_EMAIL: stub@example.com
      OPENAI_API_KEY: sk-stub
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: stub
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: stub
      CLOUDINARY_API_KEY: stub
      CLOUDINARY_API_SECRET: stub
      # Per-role accounts seeded by `npm run db:seed` in the previous step.
      E2E_CLIENT_EMAIL: client@test.zaffa
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_PLANNER_EMAIL: planner@test.zaffa
      E2E_PLANNER_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_ADMIN_EMAIL: admin@test.zaffa
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Stripe CLI
        run: |
          curl -sSL https://github.com/stripe/stripe-cli/releases/download/v1.21.5/stripe_1.21.5_linux_x86_64.tar.gz \
            | tar xz -C /usr/local/bin stripe

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema + seed test data
        # Prisma 7 dropped `--skip-generate` from `db push`; we already ran
        # `prisma generate` in the previous step, so the implicit regen here
        # is a no-op.
        run: |
          npx prisma db push
          npm run db:seed

      - name: Provision E2E auth users
        # Creates client@/planner@/admin@test.zaffa in the Supabase project
        # pointed at by E2E_SUPABASE_* AND inserts matching profile rows in
        # the ephemeral CI Postgres — see prisma/seed-e2e-auth.ts for why
        # both writes are necessary.
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npm run db:seed-e2e-users

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Forward Stripe webhooks
        # Backgrounded so the dev server (started by Playwright's webServer)
        # can reach it. The forwarder prints the whsec_ on first run; in CI
        # we provide it via secrets and pass it through STRIPE_WEBHOOK_SECRET.
        run: |
          stripe listen --forward-to localhost:3100/api/webhooks/stripe \
            --skip-verify --api-key "$STRIPE_SECRET_KEY" &
          echo $! > stripe-listen.pid

      - name: Run Playwright tests
        # Every project except the visual net: its baselines are macOS-
        # rasterised and a Linux runner cannot match them. `ignoreSnapshots`
        # in the config covers the same ground; naming the projects here makes
        # the CI gate legible from the workflow alone.
        run: |
          npx playwright test \
            --project=chromium \
            --project=desktop-en \
            --project=mobile-ar

      - name: Stop Stripe listener
        if: always()
        run: kill "$(cat stripe-listen.pid)" || true

      - name: Upload Playwright traces, screenshots, videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          # `test-results/` is Playwright's default output dir for
          # screenshots, videos, and trace.zip (config uses trace=retain-on-
          # failure). `playwright-report/` only gets generated by the `html`
          # reporter, which we don't run in CI.
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

# Production deploys are now handled by Vercel's native git integration —
# every push to `master` triggers a build on Vercel in parallel with this
# workflow, so we don't wait for lint/test/build/e2e before shipping. The
# jobs above stay green/red purely as quality signals; revert the offending
# commit if CI surfaces something serious. To force a redeploy without a
# new commit, use the Vercel dashboard or `vercel --prod`.
